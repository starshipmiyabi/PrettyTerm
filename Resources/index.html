<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'local' },
      options: {
        enableAssistiveMml: false,
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      startup: { typeset: false }
    };
  </script>
  <script defer src="tex-svg.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #f4ecde;
      --paper: #fffaf1;
      --ink: #30271f;
      --muted: #7f6e5e;
      --line: #dbc6a8;
      --soft: #efe2cf;
      --blue: #a34717;
      --blue-soft: #f4dfc5;
      --green: #34714a;
      --green-soft: #e5f0e3;
      --red: #ad4935;
      --red-soft: #f8e1d8;
      --amber: #9f4c18;
      --amber-soft: #f7e3c8;
      --mono: "SFMono-Regular", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      padding: 24px 30px 72px;
      color: var(--ink);
      background: var(--canvas);
      font: 15px/1.72 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      overflow-wrap: anywhere;
    }
    #content {
      width: min(100%, 800px);
      margin: 0 auto;
    }

    body.file-preview-mode {
      padding: 0;
      background: var(--paper);
    }
    body.file-preview-mode #content {
      width: 100%;
      max-width: none;
      margin: 0;
    }
    .file-empty { min-height: 85vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); }
    .file-empty > div { font-size: 38px; }
    .file-empty h2 { font-size: 18px; margin: 12px 0 4px; }
    .file-document {
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
    }
    .file-document-header {
      position: sticky;
      z-index: 3;
      top: 0;
      padding: 18px 30px 15px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 94%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .file-document-header h1 {
      margin: 0 0 4px;
      font-size: 16px;
      line-height: 1.3;
    }
    .file-document-path {
      overflow: hidden;
      color: var(--muted);
      font: 11px/1.4 var(--mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-markdown-body {
      width: min(100%, 940px);
      margin: 0 auto;
      padding: 34px 42px 90px;
    }
    .file-markdown-body > h1:first-child,
    .file-markdown-body > h2:first-child,
    .file-markdown-body > h3:first-child { margin-top: 0; }
    .file-source-body {
      min-width: max-content;
      padding: 18px 0 80px;
      font: 12.5px/1.65 var(--mono);
    }
    .source-line {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      min-height: 21px;
    }
    .source-line:hover { background: var(--soft); }
    .source-line .line-number {
      padding: 0 14px 0 8px;
      color: var(--muted);
      text-align: right;
      user-select: none;
    }
    .source-line code {
      display: block;
      min-width: max-content;
      padding: 0 26px 0 13px;
      color: var(--ink);
      background: transparent;
      white-space: pre;
    }

    .turn {
      margin: 0 0 34px;
      border-top: 1px solid var(--line);
    }
    .turn:first-child { border-top: 0; }
    .turn-header {
      position: relative;
      padding: 18px 0 15px;
    }
    .turn-label {
      display: inline-block;
      margin-bottom: 9px;
      color: var(--blue);
      font: 700 10px/1 var(--mono);
      letter-spacing: .13em;
    }
    .turn-prompt {
      padding: 13px 16px;
      border-left: 3px solid #bd6328;
      border-radius: 0 9px 9px 0;
      color: #41342a;
      background: var(--blue-soft);
    }
    .turn-prompt p { margin: 0; }
    .turn-events { padding-left: 2px; }

    .assistant-output { margin: 0; }
    .assistant-output + .assistant-output { padding-top: 12px; }
    .assistant-output-toolbar {
      display: flex;
      justify-content: flex-end;
      min-height: 28px;
      padding: 0 1px 2px;
    }
    .assistant-copy-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--paper);
      font: 650 11px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      cursor: default;
    }
    .assistant-copy-button:hover,
    .assistant-copy-button:focus-visible {
      color: #fffaf1;
      border-color: var(--blue);
      background: var(--blue);
      outline: none;
    }
    .assistant-copy-button span { font-size: 13px; }
    .assistant-text {
      margin: 0;
      padding: 4px 2px 12px;
    }
    .assistant-text p { margin: 0 0 .7em; }
    .assistant-text p:last-child { margin-bottom: 0; }

    .claude-waiting {
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 4px 0 32px;
      padding: 17px 19px;
      border: 1px solid #d6b58e;
      border-radius: 15px;
      background: linear-gradient(120deg, #fff9ee 0%, #f8e8d2 52%, #fff9ee 100%);
      background-size: 220% 100%;
      box-shadow: 0 8px 24px rgba(114, 61, 25, .08);
      overflow: hidden;
      animation: waiting-sheen 3.8s ease-in-out infinite;
    }
    .thought-route {
      position: relative;
      display: flex;
      align-items: center;
      width: 138px;
      min-width: 138px;
      height: 34px;
    }
    .route-terminal, .route-core {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      color: #8f4319;
      background: #f0d6b6;
      font: 750 12px/1 var(--mono);
    }
    .route-core {
      margin-left: auto;
      color: #c76538;
      background: transparent;
      animation: core-pulse 1.8s ease-out infinite;
    }
    .claude-mark {
      width: 32px;
      height: 32px;
      overflow: visible;
      filter: drop-shadow(0 2px 4px rgba(117, 54, 22, .14));
    }
    .claude-mark path {
      fill: none;
      stroke: currentColor;
      stroke-width: 3.15;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .route-line {
      position: absolute;
      right: 38px;
      left: 26px;
      height: 1px;
      background: linear-gradient(90deg, #cfa776, #b95b23);
      opacity: .65;
    }
    .thought-packet {
      position: absolute;
      z-index: 3;
      left: 29px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c76528;
      box-shadow: 0 0 0 3px rgba(199, 101, 40, .12);
      animation: packet-route 1.8s cubic-bezier(.45, 0, .3, 1) infinite;
    }
    .thought-packet:nth-of-type(2) { animation-delay: -.6s; }
    .thought-packet:nth-of-type(3) { animation-delay: -1.2s; }
    .waiting-copy { display: flex; min-width: 0; flex-direction: column; gap: 3px; }
    .waiting-copy strong { color: #713717; font-size: 13.5px; font-weight: 720; }
    .waiting-copy span { color: #8b715b; font-size: 11.5px; }
    @keyframes packet-route {
      0% { opacity: 0; transform: translateX(0) scale(.72); }
      18%, 78% { opacity: 1; }
      100% { opacity: 0; transform: translateX(65px) scale(1.05); }
    }
    @keyframes core-pulse {
      0%, 38%, 100% { opacity: .86; transform: scale(.97); }
      72% { opacity: 1; transform: scale(1.045); }
    }
    @keyframes waiting-sheen {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .quote-menu {
      position: fixed;
      z-index: 1000;
      min-width: 174px;
      padding: 5px;
      border: 1px solid rgba(112, 72, 38, .22);
      border-radius: 11px;
      background: rgba(255, 249, 238, .91);
      box-shadow: 0 10px 30px rgba(72, 42, 19, .16), 0 2px 8px rgba(72, 42, 19, .09);
      backdrop-filter: blur(18px) saturate(1.35);
      -webkit-backdrop-filter: blur(18px) saturate(1.35);
    }
    .quote-menu[hidden] { display: none; }
    .quote-menu button {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 8px;
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      color: #30271f;
      background: transparent;
      font: 13px/1.25 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      text-align: left;
      cursor: default;
    }
    .quote-menu button:hover,
    .quote-menu button:focus-visible { color: #fffaf1; background: #a34717; outline: none; }
    .quote-menu button span { width: 16px; color: #667080; font-weight: 700; text-align: center; }
    .quote-menu button:hover span,
    .quote-menu button:focus-visible span { color: #fff; }

    h1, h2, h3 {
      margin: 1.15em 0 .5em;
      line-height: 1.28;
      letter-spacing: -.018em;
    }
    h1 { font-size: 23px; }
    h2 {
      padding-bottom: 5px;
      border-bottom: 1px solid var(--line);
      font-size: 19px;
    }
    h3 { font-size: 16px; }
    ul, ol { margin: .4em 0 .85em; padding-left: 1.65em; }
    li { margin: .18em 0; padding-left: .12em; }
    li::marker { color: var(--blue); font-weight: 650; }
    .list-continuation { margin: .12em 0; }
    blockquote {
      margin: .8em 0;
      padding: 7px 13px;
      border-left: 3px solid #aeb5c0;
      color: #5f6773;
      background: var(--soft);
    }
    a {
      color: #9f4517;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    code {
      padding: 2px 5px;
      border-radius: 4px;
      color: #7e3c1d;
      background: #efe0cb;
      font: .88em/1.5 var(--mono);
    }
    pre {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 8px;
      color: #f7ead8;
      background: #352319;
      overflow-x: auto;
    }
    pre code { padding: 0; color: inherit; background: none; }
    .table-scroll {
      width: 100%;
      margin: 12px 0 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-size: 13.5px;
      line-height: 1.55;
    }
    th, td {
      padding: 10px 12px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th:last-child, td:last-child { border-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }
    th {
      color: #5e4d3d;
      background: #f1e4d1;
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    tbody tr:nth-child(even) td { background: #fcf5e9; }
    tbody tr:hover td { background: #f4e3cc; }
    .blank { height: .65em; }
    .math-block {
      margin: 12px 0;
      padding: 11px 13px;
      border-left: 2px solid #c9783c;
      background: #fbf3e7;
      overflow-x: auto;
    }
    mjx-container[jax="SVG"][display="true"] { margin: 0 !important; }

    details.event {
      margin: 9px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      overflow: clip;
    }
    details.tool-group {
      margin: 9px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      overflow: clip;
    }
    details.tool-group > summary {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 40px;
      padding: 8px 11px;
      color: #665444;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    details.tool-group > summary::-webkit-details-marker { display: none; }
    details.tool-group > summary::after {
      content: "›";
      margin-left: 2px;
      color: #9aa1aa;
      font: 18px/1 var(--mono);
      transform: rotate(90deg);
      transition: transform .14s ease;
    }
    details.tool-group[open] > summary::after { transform: rotate(-90deg); }
    .tool-group-title { min-width: 0; }
    .tool-group-count {
      margin-left: auto;
      color: #9a8069;
      font: 650 10.5px/1 var(--mono);
    }
    .tool-group-events {
      padding: 4px 8px 8px;
      border-top: 1px solid var(--line);
      background: #fbf1e3;
    }
    .tool-group-events > details.tool-event { margin: 6px 0 0; }
    details.event > summary,
    details.long-content > summary {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 11px;
      color: #665444;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    details.event > summary::-webkit-details-marker,
    details.long-content > summary::-webkit-details-marker { display: none; }
    details.event > summary::after,
    details.long-content > summary::after {
      content: "›";
      margin-left: auto;
      color: #9aa1aa;
      font: 18px/1 var(--mono);
      transform: rotate(90deg);
      transition: transform .14s ease;
    }
    details.event[open] > summary::after,
    details.long-content[open] > summary::after { transform: rotate(-90deg); }
    .event-icon {
      display: inline-grid;
      place-items: center;
      width: 21px;
      height: 21px;
      border-radius: 5px;
      color: #7d634d;
      background: var(--soft);
      font: 700 11px/1 var(--mono);
    }
    .event-body {
      padding: 10px 13px 13px;
      border-top: 1px solid var(--line);
      color: #665444;
      font-size: 13px;
      background: #fdf7ed;
    }
    .event-body p { margin: 0 0 .55em; }
    .event-body p:last-child { margin-bottom: 0; }
    .thinking-event { border-style: dashed !important; }
    .thinking-event .event-icon { color: #974d1f; background: #f2dcc1; }
    .tool-event .event-icon { color: #8b4319; background: #f4e2ca; }

    details.error-event { border-color: #ebc6ca; background: var(--red-soft); }
    .error-event > summary { color: var(--red) !important; }
    .error-event .event-icon { color: #fff; background: var(--red); }
    .error-event .event-body { border-color: #dba899; background: #fff1e9; }

    details.diff-event { border-color: #c8b392; }
    .diff-event > summary { background: #fbf3e7; }
    .diff-event .event-icon { color: #fff; background: var(--green); }
    .event-path {
      min-width: 0;
      max-width: 56%;
      color: #6b5848;
      background: transparent;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .diff-stats {
      display: inline-flex;
      gap: 7px;
      margin-left: auto;
      font: 700 11px/1 var(--mono);
    }
    .diff-stats b { color: var(--green); }
    .diff-stats i { color: var(--red); font-style: normal; }
    .diff-event > summary::after { margin-left: 0 !important; }
    .diff-view {
      max-height: 430px;
      border-top: 1px solid #d8c5a8;
      background: #fffaf1;
      overflow: auto;
      font: 11.5px/1.52 var(--mono);
    }
    .diff-line {
      display: grid;
      grid-template-columns: 28px minmax(max-content, 1fr);
      min-width: max-content;
    }
    .diff-line.add { color: #17633a; background: var(--green-soft); }
    .diff-line.remove { color: #8f303c; background: var(--red-soft); }
    .diff-line.context { color: #746354; }
    .diff-mark { padding: 1px 7px; text-align: center; user-select: none; opacity: .72; }
    .diff-line code {
      padding: 1px 16px 1px 4px;
      color: inherit;
      background: transparent;
      white-space: pre;
    }

    details.long-content {
      position: relative;
      max-height: 29rem;
      overflow: hidden;
    }
    details.long-content:not([open])::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 37px;
      left: 0;
      height: 75px;
      pointer-events: none;
      background: linear-gradient(transparent, var(--canvas));
    }
    details.long-content > summary {
      position: static;
      z-index: 1;
      justify-content: center;
      color: #9f4b1b;
      background: var(--canvas);
    }
    details.long-content > summary::after { margin-left: 0; }
    details.long-content[open] { max-height: none; overflow: visible; }
    details.long-content[open] > summary { position: static; }
    .long-content-body { padding-bottom: 42px; }
    details.long-content[open] .long-content-body { padding-bottom: 0; }

    .empty {
      margin-top: 20vh;
      padding: 24px;
      border: 1px dashed #cfb795;
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 250, 241, .72);
    }
    ::selection { background: #efc89e; }

    .edit-summary {
      margin: 15px 0 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: color-mix(in srgb, var(--paper) 92%, var(--blue-soft));
      box-shadow: 0 5px 18px rgba(95, 54, 22, .07);
      overflow: clip;
    }
    .open-local-review {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 12px;
      padding: 14px 16px;
      border: 0;
      color: var(--ink);
      background: transparent;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .open-local-review:hover { background: var(--blue-soft); }
    .open-local-review:focus-visible { outline: 2px solid var(--blue); outline-offset: -3px; }
    .edit-summary-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 10px;
      color: var(--blue);
      background: var(--blue-soft);
      font: 700 16px/1 var(--mono);
    }
    .edit-summary-title { display: flex; min-width: 0; flex: 1; align-items: baseline; gap: 10px; }
    .edit-summary-title strong { font-size: 14px; }
    .edit-total { display: inline-flex; gap: 6px; font: 700 12px/1 var(--mono); }
    .edit-total b, .edit-file b { color: var(--green); }
    .edit-total i, .edit-file i { color: var(--red); font-style: normal; }
    .edit-review-label { color: var(--blue); font-size: 13px; font-weight: 700; }
    .edit-review-label::after { content: "  ›"; }
    .edit-files { padding: 0 16px 13px 62px; }
    .edit-file { display: flex; align-items: center; gap: 12px; min-height: 31px; width: 100%; padding: 0; border: 0; color: var(--ink); background: transparent; font: inherit; text-align: left; cursor: pointer; }
    .edit-file:hover { background: var(--blue-soft); }
    .edit-file:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
    .edit-file code { min-width: 0; flex: 1; color: var(--ink); background: transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .edit-file span { display: inline-flex; gap: 6px; font: 700 11px/1 var(--mono); }
    .edit-more > summary { padding: 5px 0; color: var(--blue); font-size: 12px; font-weight: 650; cursor: pointer; list-style: none; }
    .edit-more > summary::-webkit-details-marker { display: none; }
    .edit-more > summary::after { content: "  ›"; }
    .edit-more[open] > summary::after { content: "  ⌄"; }

    .question-card {
      position: relative;
      margin: 17px 0 2px;
      border: 1px solid color-mix(in srgb, var(--line) 78%, var(--amber));
      border-radius: 22px;
      background:
        radial-gradient(circle at 92% 0%, color-mix(in srgb, var(--amber-soft) 68%, transparent) 0, transparent 34%),
        color-mix(in srgb, var(--paper) 96%, var(--amber-soft));
      box-shadow: 0 16px 42px rgba(105, 57, 21, .10), 0 2px 8px rgba(105, 57, 21, .05);
      overflow: clip;
      animation: question-arrive .34s cubic-bezier(.22, .8, .3, 1) both;
    }
    .question-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, #d47a3c, var(--blue));
      opacity: .88;
    }
    .question-card-header {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 17px 20px 11px;
    }
    .question-spark {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      border-radius: 12px;
      color: #fff8ee;
      background: linear-gradient(145deg, #d88045, #a34717);
      box-shadow: 0 6px 16px rgba(163, 71, 23, .22);
      font: 800 17px/1 Georgia, serif;
    }
    .question-card-title { flex: 1; color: var(--ink); font-size: 14px; font-weight: 760; letter-spacing: .01em; }
    .question-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d37034;
      box-shadow: 0 0 0 5px rgba(211, 112, 52, .11);
      animation: question-live 2.1s ease-in-out infinite;
    }
    .question-list { display: flex; flex-direction: column; gap: 20px; padding: 9px 20px 5px; }
    .question-block { display: flex; flex-direction: column; gap: 10px; }
    .question-block + .question-block { padding-top: 19px; border-top: 1px solid color-mix(in srgb, var(--line) 68%, transparent); }
    .question-block-head { display: flex; align-items: center; gap: 7px; min-height: 22px; }
    .question-header-badge {
      padding: 2px 9px;
      border-radius: 999px;
      color: var(--amber);
      background: var(--amber-soft);
      font: 700 10px/1.6 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .question-mode { color: var(--muted); font-size: 10.5px; font-weight: 650; }
    .question-text { margin: 0; color: var(--ink); font-size: 15px; font-weight: 680; line-height: 1.55; }
    .question-options { display: flex; flex-direction: column; gap: 9px; }
    .question-option {
      -webkit-appearance: none;
      appearance: none;
      position: relative;
      display: flex;
      width: 100%;
      min-width: 0;
      min-height: 60px;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
      border-radius: 15px;
      color: var(--ink);
      background: color-mix(in srgb, var(--paper) 90%, transparent);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .58) inset;
      font: inherit;
      text-align: left;
      cursor: pointer;
      outline: none;
      transition: transform .18s cubic-bezier(.2, .8, .2, 1), border-color .18s ease,
        background .18s ease, box-shadow .18s ease;
    }
    .question-option:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--blue) 62%, var(--line));
      background: color-mix(in srgb, var(--paper) 80%, var(--amber-soft));
      box-shadow: 0 8px 18px rgba(107, 57, 21, .09);
    }
    .question-option:active { transform: translateY(0) scale(.985); }
    .question-option:focus-visible { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent); }
    .question-option.selected {
      border-color: var(--blue);
      background: linear-gradient(135deg, color-mix(in srgb, var(--blue-soft) 92%, var(--paper)), var(--blue-soft));
      box-shadow: 0 7px 18px rgba(163, 71, 23, .12), 0 0 0 1px color-mix(in srgb, var(--blue) 14%, transparent) inset;
    }
    .question-option-mark,
    .question-option-check {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      border-radius: 9px;
      color: var(--muted);
      background: var(--soft);
      font: 700 11px/1 var(--mono);
      transition: transform .2s cubic-bezier(.2, .9, .2, 1), color .18s ease, background .18s ease;
    }
    .question-option-copy { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 2px; }
    .question-option-check { color: transparent; background: transparent; }
    .question-option.selected .question-option-mark { color: #fff8ee; background: var(--blue); transform: rotate(-7deg) scale(.92); }
    .question-option.selected .question-option-check { color: var(--blue); transform: scale(1.08); }
    .question-option-label { font-size: 13.5px; font-weight: 720; }
    .question-option-desc { color: var(--muted); font-size: 11.5px; line-height: 1.45; }
    .question-custom-wrap {
      display: grid;
      grid-template-columns: 26px auto minmax(80px, 1fr);
      min-height: 45px;
      align-items: center;
      gap: 7px;
      padding: 4px 12px;
      border: 1px solid transparent;
      border-radius: 14px;
      color: var(--muted);
      background: color-mix(in srgb, var(--soft) 58%, transparent);
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .question-custom-wrap:focus-within {
      border-color: color-mix(in srgb, var(--blue) 62%, var(--line));
      background: var(--paper);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 12%, transparent);
    }
    .question-custom-icon { display: grid; place-items: center; color: var(--blue); font-size: 17px; }
    .question-custom-label { font-size: 11.5px; font-weight: 700; white-space: nowrap; }
    .question-custom-input {
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
      padding: 7px 0;
      border: 0;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    .question-custom-input::placeholder { color: var(--muted); }
    .question-card-footer { display: flex; justify-content: flex-end; padding: 15px 20px 20px; }
    .question-submit {
      -webkit-appearance: none;
      appearance: none;
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      gap: 12px;
      padding: 7px 9px 7px 18px;
      border: 1px solid color-mix(in srgb, var(--blue) 82%, #6f2a0a);
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(145deg, #bd5b26, #913811);
      box-shadow: 0 8px 20px rgba(142, 54, 17, .22), 0 1px 0 rgba(255, 255, 255, .18) inset;
      font: 700 13px/1 inherit;
      cursor: pointer;
      outline: none;
      transition: transform .18s cubic-bezier(.2, .8, .2, 1), box-shadow .18s ease, filter .18s ease;
    }
    .question-submit-arrow {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      color: var(--blue);
      background: #fff8ed;
      font-size: 14px;
      transition: transform .2s cubic-bezier(.2, .9, .2, 1);
    }
    .question-submit:hover { filter: brightness(1.04); transform: translateY(-1px); box-shadow: 0 11px 24px rgba(142, 54, 17, .26); }
    .question-submit:hover .question-submit-arrow { transform: rotate(8deg) translate(1px, -1px); }
    .question-submit:active { transform: translateY(0) scale(.975); }
    .question-submit:focus-visible { box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 20%, transparent), 0 8px 20px rgba(142, 54, 17, .22); }
    .question-submit:disabled { cursor: default; filter: none; transform: none; }
    .question-card.submitted .question-option,
    .question-card.submitted .question-custom-input { pointer-events: none; opacity: .75; }
    .question-card.submitted .question-submit { color: var(--green); border-color: color-mix(in srgb, var(--green) 46%, var(--line)); background: var(--green-soft); box-shadow: none; }
    .question-card.submitted .question-submit-arrow { color: #fff; background: var(--green); }
    .question-card.answered .question-spark { background: var(--green); box-shadow: 0 6px 16px color-mix(in srgb, var(--green) 22%, transparent); }
    .question-answer-text { padding: 5px 20px 19px 65px; color: var(--ink); font-size: 13px; }
    .question-answer-text p { margin: 0 0 .5em; }
    .question-answer-text p:last-child { margin-bottom: 0; }
    .question-option.selection-pop { animation: option-select .28s cubic-bezier(.2, .85, .25, 1); }
    .question-card.needs-answer { animation: question-nudge .28s ease; }
    @keyframes question-arrive { from { opacity: 0; transform: translateY(7px) scale(.992); } to { opacity: 1; transform: none; } }
    @keyframes question-live { 0%, 100% { opacity: .48; transform: scale(.82); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes option-select { 0% { transform: scale(.985); } 58% { transform: scale(1.012); } 100% { transform: none; } }
    @keyframes question-nudge { 0%, 100% { transform: translateX(0); } 35% { transform: translateX(-4px); } 70% { transform: translateX(4px); } }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #211912;
        --paper: #2d2118;
        --ink: #f3e5d3;
        --muted: #b9a28c;
        --line: #60442f;
        --soft: #3a291c;
        --blue: #e58a49;
        --blue-soft: #472819;
        --green: #7ec98b;
        --green-soft: #203c2b;
        --red: #f47a59;
        --red-soft: #4a241c;
        --amber: #e99a54;
        --amber-soft: #46301e;
      }
      .turn-prompt { color: #f0ddc8; border-left-color: #c86e31; }
      blockquote { color: #c8b5a3; border-left-color: #79543a; }
      a { color: #f1a56c; }
      code { color: #efaa78; background: #3c291d; }
      pre { color: #f3e5d3; background: #17100b; }
      th { color: #ead8c5; background: #3a291d; }
      tbody tr:nth-child(even) td { background: #271b13; }
      tbody tr:hover td { background: #3d291b; }
      .math-block { border-left-color: #a95d2c; background: #291d15; }
      details.event > summary,
      details.long-content > summary { color: #d5c2ae; }
      details.tool-group { border-color: #5d4934; background: #2a1d15; }
      details.tool-group > summary { color: #d5c2ae; }
      .tool-group-count { color: #bfa58d; }
      .tool-group-events { border-color: #5d4934; background: #21170f; }
      .event-icon { color: #d1b79c; }
      .event-body { color: #d5c2ae; background: #271b13; }
      .thinking-event .event-icon { color: #ef9c61; background: #4a2a19; }
      .tool-event .event-icon { color: #e89558; background: #412719; }
      .error-event .event-body { border-color: #73382b; background: #371b16; }
      details.diff-event { border-color: #5d4934; }
      .diff-event > summary { background: #312218; }
      .event-path { color: #ccb7a3; }
      .diff-view { border-color: #5b4330; background: #1c140f; }
      .diff-line.add { color: #8fe0ad; }
      .diff-line.remove { color: #ff9da7; }
      .diff-line.context { color: #bfa994; }
      details.long-content > summary { color: #efa26a; }
      .empty { background: rgba(45, 33, 24, .78); }
      .claude-waiting {
        border-color: #6b4a31;
        background: linear-gradient(120deg, #2d2118 0%, #422817 52%, #2d2118 100%);
        box-shadow: 0 8px 26px rgba(0, 0, 0, .2);
      }
      .route-terminal { color: #efaa78; background: #452a1a; }
      .route-line { background: linear-gradient(90deg, #805136, #e17a3c); }
      .route-core { color: #e9784b; background: transparent; }
      .claude-mark { filter: drop-shadow(0 2px 6px rgba(233, 120, 75, .2)); }
      .thought-packet { background: #ee8c50; box-shadow: 0 0 0 3px rgba(238, 140, 80, .11); }
      .waiting-copy strong { color: #f0c19d; }
      .waiting-copy span { color: #bda58f; }
      .quote-menu {
        border-color: rgba(255, 255, 255, .12);
        background: rgba(50, 35, 25, .92);
        box-shadow: 0 12px 34px rgba(0, 0, 0, .38), 0 2px 8px rgba(0, 0, 0, .24);
      }
      .quote-menu button { color: #f3e5d3; }
      .quote-menu button span { color: #c2aa93; }
      ::selection { background: #784322; }
    }

    @media (max-width: 680px) {
      body { padding: 18px 16px 56px; }
      .turn { margin-bottom: 27px; }
      .event-path { max-width: 42%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .001ms !important;
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
      .thought-packet { opacity: .72; transform: translateX(36px); }
    }
  </style>
