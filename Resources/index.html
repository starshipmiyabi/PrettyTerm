<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: true
      },
      svg: { fontCache: 'local' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      startup: { typeset: false }
    };
  </script>
  <script defer src="tex-svg.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #f7f8fa;
      --paper: #ffffff;
      --ink: #20242b;
      --muted: #777f8c;
      --line: #e4e7eb;
      --soft: #f1f3f5;
      --blue: #456ee6;
      --blue-soft: #eef3ff;
      --green: #228b57;
      --green-soft: #eaf7f0;
      --red: #bd3f4d;
      --red-soft: #fff0f1;
      --amber: #9a6713;
      --amber-soft: #fff8e7;
      --mono: "SFMono-Regular", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      padding: 24px 30px 72px;
      color: var(--ink);
      background: var(--canvas);
      font: 15px/1.72 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      overflow-wrap: anywhere;
    }
    #content {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    .turn {
      margin: 0 0 34px;
      border-top: 1px solid var(--line);
    }
    .turn:first-child { border-top: 0; }
    .turn-header {
      position: relative;
      padding: 18px 0 15px;
    }
    .turn-label {
      display: inline-block;
      margin-bottom: 9px;
      color: var(--blue);
      font: 700 10px/1 var(--mono);
      letter-spacing: .13em;
    }
    .turn-prompt {
      padding: 13px 16px;
      border-left: 3px solid #a8b9ee;
      border-radius: 0 9px 9px 0;
      color: #333a45;
      background: var(--blue-soft);
    }
    .turn-prompt p { margin: 0; }
    .turn-events { padding-left: 2px; }

    .assistant-text {
      margin: 0;
      padding: 4px 2px 12px;
    }
    .assistant-text + .assistant-text { padding-top: 12px; }
    .assistant-text p { margin: 0 0 .7em; }
    .assistant-text p:last-child { margin-bottom: 0; }

    .quote-menu {
      position: fixed;
      z-index: 1000;
      min-width: 174px;
      padding: 5px;
      border: 1px solid rgba(80, 86, 96, .18);
      border-radius: 11px;
      background: rgba(250, 250, 252, .88);
      box-shadow: 0 10px 30px rgba(20, 24, 31, .18), 0 2px 8px rgba(20, 24, 31, .10);
      backdrop-filter: blur(18px) saturate(1.35);
      -webkit-backdrop-filter: blur(18px) saturate(1.35);
    }
    .quote-menu[hidden] { display: none; }
    .quote-menu button {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 8px;
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      color: #20242b;
      background: transparent;
      font: 13px/1.25 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      text-align: left;
      cursor: default;
    }
    .quote-menu button:hover,
    .quote-menu button:focus-visible { color: #fff; background: #3478f6; outline: none; }
    .quote-menu button span { width: 16px; color: #667080; font-weight: 700; text-align: center; }
    .quote-menu button:hover span,
    .quote-menu button:focus-visible span { color: #fff; }

    h1, h2, h3 {
      margin: 1.15em 0 .5em;
      line-height: 1.28;
      letter-spacing: -.018em;
    }
    h1 { font-size: 23px; }
    h2 {
      padding-bottom: 5px;
      border-bottom: 1px solid var(--line);
      font-size: 19px;
    }
    h3 { font-size: 16px; }
    ul, ol { margin: .4em 0 .85em; padding-left: 1.65em; }
    li { margin: .18em 0; padding-left: .12em; }
    li::marker { color: var(--blue); font-weight: 650; }
    .list-continuation { margin: .12em 0; }
    blockquote {
      margin: .8em 0;
      padding: 7px 13px;
      border-left: 3px solid #aeb5c0;
      color: #5f6773;
      background: var(--soft);
    }
    a {
      color: #315fd4;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    code {
      padding: 2px 5px;
      border-radius: 4px;
      color: #874468;
      background: #f2edf2;
      font: .88em/1.5 var(--mono);
    }
    pre {
      margin: 12px 0;
      padding: 14px 16px;
      border-radius: 8px;
      color: #ecf0f5;
      background: #20252d;
      overflow-x: auto;
    }
    pre code { padding: 0; color: inherit; background: none; }
    .table-scroll {
      width: 100%;
      margin: 12px 0 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-size: 13.5px;
      line-height: 1.55;
    }
    th, td {
      padding: 10px 12px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th:last-child, td:last-child { border-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }
    th {
      color: #4d5663;
      background: #f2f4f7;
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    tbody tr:nth-child(even) td { background: #fafbfc; }
    tbody tr:hover td { background: #f3f7ff; }
    .blank { height: .65em; }
    .math-block {
      margin: 12px 0;
      padding: 11px 13px;
      border-left: 2px solid #b5c3ed;
      background: #fafbfe;
      overflow-x: auto;
    }
    mjx-container[jax="SVG"][display="true"] { margin: 0 !important; }

    details.event {
      margin: 9px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      overflow: clip;
    }
    details.event > summary,
    details.long-content > summary {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 11px;
      color: #555e6a;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    details.event > summary::-webkit-details-marker,
    details.long-content > summary::-webkit-details-marker { display: none; }
    details.event > summary::after,
    details.long-content > summary::after {
      content: "›";
      margin-left: auto;
      color: #9aa1aa;
      font: 18px/1 var(--mono);
      transform: rotate(90deg);
      transition: transform .14s ease;
    }
    details.event[open] > summary::after,
    details.long-content[open] > summary::after { transform: rotate(-90deg); }
    .event-icon {
      display: inline-grid;
      place-items: center;
      width: 21px;
      height: 21px;
      border-radius: 5px;
      color: #697382;
      background: var(--soft);
      font: 700 11px/1 var(--mono);
    }
    .event-body {
      padding: 10px 13px 13px;
      border-top: 1px solid var(--line);
      color: #555d68;
      font-size: 13px;
      background: #fbfcfd;
    }
    .event-body p { margin: 0 0 .55em; }
    .event-body p:last-child { margin-bottom: 0; }
    .thinking-event { border-style: dashed !important; }
    .thinking-event .event-icon { color: #6f62b3; background: #f1effd; }
    .tool-event .event-icon { color: #3c6d8b; background: #edf6fa; }

    details.error-event { border-color: #ebc6ca; background: var(--red-soft); }
    .error-event > summary { color: var(--red) !important; }
    .error-event .event-icon { color: #fff; background: var(--red); }
    .error-event .event-body { border-color: #ebc6ca; background: #fff8f8; }

    details.diff-event { border-color: #cbd7cf; }
    .diff-event > summary { background: #f7faf8; }
    .diff-event .event-icon { color: #fff; background: var(--green); }
    .event-path {
      min-width: 0;
      max-width: 56%;
      color: #56615a;
      background: transparent;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .diff-stats {
      display: inline-flex;
      gap: 7px;
      margin-left: auto;
      font: 700 11px/1 var(--mono);
    }
    .diff-stats b { color: var(--green); }
    .diff-stats i { color: var(--red); font-style: normal; }
    .diff-event > summary::after { margin-left: 0 !important; }
    .diff-view {
      max-height: 430px;
      border-top: 1px solid #d9e1dc;
      background: #fbfcfb;
      overflow: auto;
      font: 11.5px/1.52 var(--mono);
    }
    .diff-line {
      display: grid;
      grid-template-columns: 28px minmax(max-content, 1fr);
      min-width: max-content;
    }
    .diff-line.add { color: #17633a; background: var(--green-soft); }
    .diff-line.remove { color: #8f303c; background: var(--red-soft); }
    .diff-line.context { color: #626a74; }
    .diff-mark { padding: 1px 7px; text-align: center; user-select: none; opacity: .72; }
    .diff-line code {
      padding: 1px 16px 1px 4px;
      color: inherit;
      background: transparent;
      white-space: pre;
    }

    details.long-content {
      position: relative;
      max-height: 29rem;
      overflow: hidden;
    }
    details.long-content:not([open])::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 37px;
      left: 0;
      height: 75px;
      pointer-events: none;
      background: linear-gradient(transparent, var(--canvas));
    }
    details.long-content > summary {
      position: static;
      z-index: 1;
      justify-content: center;
      color: #4763aa;
      background: var(--canvas);
    }
    details.long-content > summary::after { margin-left: 0; }
    details.long-content[open] { max-height: none; overflow: visible; }
    details.long-content[open] > summary { position: static; }
    .long-content-body { padding-bottom: 42px; }
    details.long-content[open] .long-content-body { padding-bottom: 0; }

    .empty {
      margin-top: 20vh;
      padding: 24px;
      border: 1px dashed #cbd0d7;
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
      background: rgba(255, 255, 255, .6);
    }
    ::selection { background: #dce6ff; }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #17191d;
        --paper: #202329;
        --ink: #eef1f5;
        --muted: #9ba3af;
        --line: #353a43;
        --soft: #2a2e35;
        --blue: #87a7ff;
        --blue-soft: #242d42;
        --green: #58c78b;
        --green-soft: #183326;
        --red: #ff7c88;
        --red-soft: #3b2025;
        --amber: #e5ae50;
        --amber-soft: #352b1b;
      }
      .turn-prompt { color: #dbe4f5; border-left-color: #667fca; }
      blockquote { color: #bdc4ce; border-left-color: #5c6571; }
      a { color: #9bb5ff; }
      code { color: #e2a9c7; background: #342a35; }
      pre { color: #edf1f7; background: #111318; }
      th { color: #dce1e8; background: #292d34; }
      tbody tr:nth-child(even) td { background: #1c1f24; }
      tbody tr:hover td { background: #252d3d; }
      .math-block { border-left-color: #5d73ae; background: #1d2129; }
      details.event > summary,
      details.long-content > summary { color: #c5cbd4; }
      .event-icon { color: #bcc4cf; }
      .event-body { color: #c8cdd5; background: #1b1e23; }
      .thinking-event .event-icon { color: #b7aaff; background: #302b4b; }
      .tool-event .event-icon { color: #92c8e7; background: #203542; }
      .error-event .event-body { border-color: #66363d; background: #2d1b1f; }
      details.diff-event { border-color: #3d5748; }
      .diff-event > summary { background: #1c2721; }
      .event-path { color: #bac4bd; }
      .diff-view { border-color: #3d4a42; background: #161a18; }
      .diff-line.add { color: #8fe0ad; }
      .diff-line.remove { color: #ff9da7; }
      .diff-line.context { color: #aeb5bf; }
      details.long-content > summary { color: #9fb4ff; }
      .empty { background: rgba(32, 35, 41, .72); }
      .quote-menu {
        border-color: rgba(255, 255, 255, .12);
        background: rgba(42, 44, 49, .90);
        box-shadow: 0 12px 34px rgba(0, 0, 0, .38), 0 2px 8px rgba(0, 0, 0, .24);
      }
      .quote-menu button { color: #f1f3f6; }
      .quote-menu button span { color: #aab1bc; }
      ::selection { background: #344c86; }
    }

    @media (max-width: 680px) {
      body { padding: 18px 16px 56px; }
      .turn { margin-bottom: 27px; }
      .event-path { max-width: 42%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main id="content"><div class="empty">正在读取 Claude 的会话事件…</div></main>
  <script src="app.js"></script>
</body>
</html>
